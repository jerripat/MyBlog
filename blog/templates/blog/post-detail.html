{% extends 'base.html' %}
{% load static %}

{% block title %}
{{ post.title}}
{% endblock %}

{%  block css_files %}
    <link rel="stylesheet" href="{% static 'css/post-detail.css' %}">

{% endblock %}

{% block content %}
<section id="summary">
    <h2>{{  post.title }}</h2>
    <article>
        <img src="{% static 'blog/images/'|add:post.image_name %}" alt="{{ post.title }}">"
        <address>By <a href="mailto:jerripatterson@gmail.com">{{  post.author }}</a></address>
        <div>Last updated on <time>{{  post.date|date:"M d Y"  }}</time></div>
    </article>
</section>
    <main>
    {{ post.content|safe }}
    </main>
{% endblock %}
